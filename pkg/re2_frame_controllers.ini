; re2_frame_controllers.ini
; Lines starting with ; are comments. Changes need a game restart,
; except [pose], which is re-read once a second (OpenXR only).

[options]
; Menus: REFramework sends only up/down from the D-pad. While a menu is open
; (title menu, pause, inventory, files - not the map) the D-pad also moves
; the left stick, which the menus follow. Never active in gameplay.
; 1 = on, 0 = off
menu_dpad_stick = 1

; Right trigger also aims, so you can shoot without holding the right grip.
; 0 = off (default, as in REFramework: aim with the right grip), 1 = on
trigger_aims = 0
; Only with trigger_aims = 1: the first shot waits this long (ms) so the
; weapon is raised, and aiming is kept this long (ms) after release.
fire_delay_ms = 150
aim_hold_ms = 800

; OpenVR only: REFramework's in-headset menu (aim the right controller at the
; left hand). SteamVR shows no laser for it with Steam Frame controllers, so
; the plugin points with the right controller's tip: right trigger = click,
; right stick up/down = scroll. Tip: set "Draw Cursor With Menu Open" in
; REFramework to see the cursor. 1 = on, 0 = off
overlay_pointer = 1
pointer_scroll = 0.2
; SteamVR takes the controllers away from the game while the menu is
; interactive (for its own laser, which it does not show with Frame). 1 = keep
; the controllers for the plugin's pointer (needed for clicks), 0 = SteamVR.
pointer_keep_input = 1
; How the hit point maps to the menu: 0 = whole texture (default, verified
; with Steam Frame: SteamVR reports the hit over the whole texture),
; 1 = shown part only.
pointer_uv_mode = 0
; REFramework closes its menu when you look away from it. 1 = keep it open
; while the right controller points at it. 0 = REFramework default.
pointer_hold_menu = 0
; The desktop mouse position can override the pointer in the menu (cursor
; jumps away, buttons highlight only now and then). 1 = while the pointer is
; on the menu, REFramework reads the pointer instead of the desktop mouse.
pointer_fix_cursor = 1

[bindings]
; Override the built-in Frame bindings. Used by OpenXR AND OpenVR.
; Format:  action = path[, path ...]     (empty = unbound)
; An action listed here replaces ALL its built-in bindings.
;
; REFramework actions used by RE2:
;   trigger grip joystick joystickclick abutton bbutton systembutton
;   dpad_up dpad_down dpad_left dpad_right minimap weapondial_start
;   re2_change_ammo re2_reset_view re2_quickturn re2_toggle_flashlight
;   re2_firstperson_toggle re3_dodge
; Plugin buttons (right hand, injected as LEFT-hand actions):
;   frame_b -> abutton/left (Xbox B, back/cancel)
;   frame_y -> bbutton/left (Xbox Y, inventory)
;
; Frame paths:
;   right: a b x y menu bumper  (/click)   trigger squeeze (/value)
;          thumbstick (stick)  thumbstick/click
;   left:  dpad_up dpad_down dpad_left dpad_right view bumper (/click)
;          trigger squeeze (/value)  thumbstick  thumbstick/click
;   e.g. /user/hand/right/input/bumper/click
;
; Built-in "grip" = both squeezes + both bumpers (RB = menu tab right).
; Examples (remove the ; to use):
; re2_toggle_flashlight = /user/hand/left/input/thumbstick/click
; re2_quickturn = /user/hand/right/input/b/click

[pose]
; Hand pose correction in the controller's own grip frame (OpenXR only).
; rotation = pitch yaw roll (degrees), position = x y z (centimeters)
left_rotation = 0 0 0
left_position = 0 0 0
right_rotation = 0 0 0
right_position = 0 0 0
